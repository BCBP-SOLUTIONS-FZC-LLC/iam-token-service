# prometheus-adapter rule — a MERGE SNIPPET, not a manifest. Do not
# `kubectl apply` it: prometheus-adapter reads one ConfigMap for the whole
# cluster, so applying a ConfigMap here would replace every other service's
# rules.
#
# Add the rule below to the prometheus-adapter Helm release's values under
# `rules.custom` (prometheus-community/prometheus-adapter chart). The rule is
# service-agnostic: every service on platform-gincommon exposes
# platform_http_requests_total, so it only needs to exist ONCE per cluster.
# If another service's chart docs already added it, there is nothing to do.
#
# It exposes per-pod RPS as platform_http_requests_per_second for the HPA's
# `type: Pods` metric (deploy/helm/templates/hpa.yaml, enabled by
# autoscaling.targetRPSPerReplica). The HPA scopes the metric to its own
# target's pods, so no service label is needed here.
#
# Reference:
#   https://github.com/kubernetes-sigs/prometheus-adapter/blob/master/docs/config.md
#
# After the adapter reloads, verify the metric is visible:
#   kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1 | jq '.resources[].name' | grep platform_http_requests_per_second
rules:
  custom:
    - seriesQuery: 'platform_http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)_total$"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
