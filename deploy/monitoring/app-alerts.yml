# Prometheus alerting rules for the iam-token-service application.
#
# HTTP request metrics (http_request_duration_seconds, http_requests_total) are
# emitted by platform-gincommon. Business event counters
# (iam_token_service_*, §11.2/§25 — the frozen metric prefix) are registered
# in internal/adapter/outbound/metrics/metrics.go. Outbox/SQS metrics
# (events_*, outbox_*, sqs_*) are emitted by platform-events with a
# ConstLabel service="iam-token-service".
#
# This is a standalone reference copy of the same alerts the chart's own
# templates/prometheusrule.yaml renders as a PrometheusRule CRD (enabled via
# serviceMonitor.enabled in values.yaml) — use this file directly (e.g. a
# Prometheus --rule-files directory) in environments not installing this
# service via the Helm chart; keep both in sync when adding a new alert.
#
# Do not add an alert on a metric that doesn't exist in the code (grep
# internal/adapter/outbound/metrics/metrics.go first) — the two
# tenant-isolation alerts below are a known exception: they reference
# iam_token_service_rls_violations_total, which this service does not
# currently emit. They are shipped now (no-op, "no data" in Prometheus, not
# an error) as a placeholder for when that counter is wired — see each
# alert's description for the caveat.
#
# Labels on all HTTP metrics (from platform-gincommon):
#   service  — "iam-token-service"
#   method   — HTTP method
#   path     — route pattern
#   status   — HTTP status code

groups:
  - name: iam_token_service_availability
    rules:

      # ── Service down ────────────────────────────────────────────────
      - alert: IAMTokenServiceServerDown
        expr: |
          absent(up{job="iam-token-service-server"} == 1)
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-token-service server has no healthy instances
          description: >-
            No iam-token-service server pods have been scraped as healthy
            for 2 minutes — this blocks TS-1..TS-4. Check pod readiness:
            kubectl get pods -l app.kubernetes.io/component=server,app.kubernetes.io/name=iam-token-service

      - alert: IAMTokenServiceConsumerDown
        expr: |
          absent(up{job="iam-token-service-consumer"} == 1)
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service consumer has no healthy instances
          description: >-
            No iam-token-service consumer pods have been scraped as healthy
            for 2 minutes — the TenantMembershipsPurged offboarding cascade
            cannot run. SQS at-least-once delivery means messages accumulate
            rather than being lost, but offboarded tenants' credentials
            will not be revoked until this recovers.

      # ── Pod count below minimum ─────────────────────────────────────
      - alert: IAMTokenServiceServerReplicasMissing
        expr: |
          sum(up{job="iam-token-service-server"}) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service server running below configured replica count
          description: >-
            Fewer than the configured server replica count are healthy.
            Current healthy count: {{ $value }}.

      # ── Rotator CronJob missed its schedule ─────────────────────────
      - alert: IAMTokenServiceRotatorNotRunning
        expr: |
          time() - kube_cronjob_status_last_successful_time{cronjob="iam-token-service-rotator"} > 900
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service rotator has not completed successfully recently
          description: >-
            The rotator CronJob (overlap-expiry sweep §8.3, orphan-material
            reconciler §8.6, prune) has not had a successful run in over 15
            minutes against its configured schedule. Check kubectl get jobs
            -l app.kubernetes.io/component=rotator.

  - name: iam_token_service_errors
    rules:

      # ── HTTP 5xx error rate (server) ──────────────────────────────────
      - alert: IAMTokenServiceHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="iam-token-service-server", status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="iam-token-service-server"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service 5xx error rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of requests are returning 5xx errors
            over the last 5 minutes. Check Postgres/OpenBao dependency
            health and application logs.

      # ── OpenBao call failures via elevated call duration (proxy — no
      #    dedicated failure counter exists; a stalled/unreachable OpenBao
      #    shows up as call duration piling up against HTTPTimeout) ──────
      - alert: IAMTokenServiceOpenBaoCallLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, op) (
              rate(iam_token_service_openbao_call_duration_seconds_bucket{job="iam-token-service-server"}[5m])
            )
          ) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service OpenBao call p99 latency above 5s
          description: >-
            OpenBao KV v2 {{ $labels.op }} calls are taking over 5s at p99 —
            approaching the 8s HTTPTimeout default. Check OpenBao health
            and the Kubernetes auth login path (§10.5).

      # ── Offboarding cascade failures ──────────────────────────────────
      - alert: IAMTokenServiceOffboardingCascadeFailures
        expr: |
          increase(iam_token_service_offboarding_cascade_total{job="iam-token-service-consumer", result="error"}[15m]) > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service offboarding cascade is failing
          description: >-
            {{ $value | humanize }} offboarding-cascade error(s) in the last 15
            minutes (§8.4) — TenantMembershipsPurged is not fully
            processing. Credential revocation for offboarded tenants may be
            delayed. SQS redelivery will retry; investigate consumer logs
            if this persists.

      # ── Overlap-expiry sweep failures ─────────────────────────────────
      - alert: IAMTokenServiceRotationSweepFailures
        expr: |
          increase(iam_token_service_rotation_sweep_total{job="iam-token-service-rotator", result="error"}[1h]) > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service overlap-expiry sweep is failing
          description: >-
            {{ $value | humanize }} sweep error(s) in the last hour (§8.3) —
            overlap-window credential material may not be revoked on time.
            Check rotator CronJob logs.

      # ── Orphan-material reconciler found material with no owning row —
      #    page-worthy per §11.5 (a real inconsistency, not routine) ─────
      - alert: IAMTokenServiceOrphanMaterialMissing
        expr: |
          increase(iam_token_service_material_reconcile_total{job="iam-token-service-rotator", result="missing_material"}[1h]) > 0
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-token-service reconciler found a credential row with no OpenBao material
          description: >-
            {{ $value | humanize }} missing_material result(s) from the §8.6
            orphan-material reconciler in the last hour — a credential row
            exists in Postgres with no corresponding OpenBao secret.
            Investigate immediately; this principal cannot authenticate.

  - name: iam_token_service_latency
    rules:

      # ── p99 request latency (server) ──────────────────────────────────
      - alert: IAMTokenServiceHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="iam-token-service-server"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service p99 latency above 1s
          description: >-
            The p99 request duration is {{ $value | humanizeDuration }}. Check
            iam_token_service_openbao_call_duration_seconds{op} for the
            likely cause.

  - name: iam_token_service_credential_lifecycle
    rules:

      # ── Rotation overlap window not draining (§6.2/§8.3) ──────────────
      - alert: IAMTokenServiceRotationOverlapStuck
        expr: |
          iam_token_service_rotation_overlap_active{job="iam-token-service-server"} > 0
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service has credentials stuck in the rotation overlap window
          description: >-
            {{ $value | humanize }} credential(s) have been `rotating` for over an
            hour — this should trend to zero as the overlap window expires
            and the §8.3 sweep runs. Check the rotator CronJob.

  - name: iam_token_service_outbox_and_queues
    rules:

      # ── Transactional outbox dead-letters — outbox_dead_letters_total
      #    is platform-events' own metric (registered automatically by
      #    events.Init), not something this service defines itself.
      - alert: IAMTokenServiceOutboxStuck
        expr: |
          increase(outbox_dead_letters_total{service="iam-token-service"}[30m]) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service outbox events moved to the dead-letter table
          description: >-
            One or more produced service-account-lifecycle events
            (ServiceAccountRegistered, ServiceAccountCredentialIssued,
            ServiceAccountCredentialRotated, ServiceAccountCredentialRevoked,
            ServiceAccountRevoked) exhausted MaxAttempts and were moved to
            outbox_dead_letters. Check the outbox runner logs for SNS
            publish errors and verify SNS_TOPIC_SERVICEACCOUNT_ARN
            connectivity; outbox_dead_letters is queryable/retryable via
            standard SQL.

      # ── SQS ReceiveMessage errors on the offboarding queue ────────────
      - alert: IAMTokenServiceSQSReceiveErrors
        expr: |
          increase(sqs_receive_errors_total{service="iam-token-service"}[30m]) > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service is failing to receive from the offboarding queue
          description: >-
            {{ $value | humanize }} SQS ReceiveMessage error(s) (excludes context
            cancellation) in the last 30 minutes. Check IAM permissions and
            queue connectivity for the offboarding queue.

      # ── Outbox backlog building up (before dead-letter, above) ────────
      # outbox_pending_total is platform-events' own gauge (see
      # internal/adapter/outbound/metrics/metrics.go's header comment for
      # why this service does not duplicate it) — a sustained backlog here
      # means the 500ms outbox runner is falling behind or stalled, distinct
      # from IAMTokenServiceOutboxStuck (only fires once MaxAttempts is
      # exhausted and a row is dead-lettered — this catches the earlier,
      # still-recoverable stage).
      - alert: IAMTokenServiceOutboxBacklogGrowing
        expr: |
          outbox_pending_total{service="iam-token-service"} > 100
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service outbox has a growing unrelayed backlog
          description: >-
            {{ $value | humanize }} outbox rows have been unrelayed for 15+
            minutes. Check the outbox runner logs and SNS_TOPIC_SERVICEACCOUNT_ARN
            connectivity before this escalates to dead-lettered events.

      # ── Postgres connection pool exhaustion ───────────────────────────
      # pgcommon_pool_empty_acquire_total (platform-pgcommon's
      # PoolStatsCollector, wired in cmd/server/consumer/rotator's main.go)
      # counts acquires that had to wait because the pool had no idle
      # connection — a rising count under normal traffic means PG_MAX_CONNS
      # is undersized for current concurrency, or a slow query/transaction
      # is holding connections open longer than expected. The "-reconciler"
      # suffix on the service label distinguishes cmd/rotator's/cmd/server's
      # BYPASSRLS reconciler pool from the RLS-scoped app pool.
      - alert: IAMTokenServicePostgresPoolExhaustion
        expr: |
          increase(pgcommon_pool_empty_acquire_total{service=~"^iam-token-service.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service Postgres connection pool is exhausted
          description: >-
            One or more requests on pool "{{ $labels.service }}" had to wait
            for a connection because none were idle. Compare
            pgcommon_pool_acquired_conns to pgcommon_pool_max_conns and check
            for slow queries/long-held transactions before raising
            PG_MAX_CONNS.

      # ── SQS backlog/message-age on the offboarding queue ──────────────
      # NOTE: this requires a CloudWatch metrics exporter (e.g.
      # yet-another-cloudwatch-exporter) scraping
      # tenant-lifecycle-tokensvc-q into
      # aws_sqs_approximate_age_of_oldest_message_maximum — neither this
      # service's process nor platform-events exposes queue depth/age
      # in-process (SQS ReceiveMessage never reveals it; only the AWS API
      # does). Dormant (no data, never fires) until that exporter is
      # deployed and configured for this queue — IAMTokenServiceSQSReceiveErrors
      # above is what IS monitored today without one.
      - alert: IAMTokenServiceOffboardingQueueBacklogGrowing
        expr: |
          aws_sqs_approximate_age_of_oldest_message_maximum{queue_name="tenant-lifecycle-tokensvc-q"} > 900
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-token-service's offboarding queue has a growing backlog
          description: >-
            The oldest unprocessed TenantMembershipsPurged message on
            tenant-lifecycle-tokensvc-q has been waiting more than 15
            minutes — the consumer may be stalled or under-provisioned
            (SQS_OFFBOARDING_CONCURRENCY). Check consumer pod health and
            IAMTokenServiceConsumerDown.

  - name: iam_token_service_tenant_isolation
    rules:

      # ── RLS-6 cross-tenant access (§17.5 Case 5 equivalent) ───────────
      # NOTE — this service does not currently emit
      # iam_token_service_rls_violations_total; this alert is a wired-but-
      # dormant placeholder (no data, never fires) until that counter is
      # built. Do not assume RLS violations are being monitored today.
      - alert: IAMTokenServiceRLSCrossTenantAccess
        expr: |
          increase(iam_token_service_rls_violations_total{violation_type="cross_tenant_access"}[5m]) > 0
        labels:
          severity: critical
          team: platform
          compliance: tenant-isolation
        annotations:
          summary: RLS blocked a cross-tenant access attempt
          description: >-
            A caller with a valid tenant GUC attempted to read/write a row
            belonging to a different tenant. This alert has no `for` clause
            — one occurrence is enough to page.

      # ── RLS-6 missing/invalid GUC (§17.5 Case 5 equivalent) ───────────
      # NOTE — same caveat as above: dormant until
      # iam_token_service_rls_violations_total is wired.
      - alert: IAMTokenServiceRLSMissingGUC
        expr: |
          rate(iam_token_service_rls_violations_total{violation_type="missing_or_invalid_guc"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: RLS violations from missing or invalid tenant GUC
          description: >-
            A caller path is not binding app.tenant_id via SET LOCAL (RLS-6)
            before touching a tenant-scoped table.
