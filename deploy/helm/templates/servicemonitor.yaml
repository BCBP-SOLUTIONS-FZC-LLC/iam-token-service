{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "iam-token-service.fullname" . }}
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "iam-token-service.selectorLabels" . | nindent 6 }}
  endpoints:
    # Metrics are served on the dedicated "metrics" port (9090), separate
    # from the "http" API port — scraping never touches the API surface.
    # Matches every workload's Service (server, consumer) by the shared
    # base selector labels; covers the iam_token_service_* (§11.2/§25)
    # business metrics plus the passthrough http_*/outbox_*/events_*
    # metrics platform-gincommon/platform-events already emit.
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
