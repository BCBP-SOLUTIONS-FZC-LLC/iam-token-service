{{/*
Renders a Secret from .Values.secretValues ONLY when no existingSecret /
database.existingSecretName is set — a convenience for local/dev installs.
Real environments MUST set .Values.existingSecret (or
.Values.database.existingSecretName) to a Secret managed out-of-band (e.g.
External Secrets Operator pulling from OpenBao/AWS Secrets Manager) — never
commit DATABASE_URL/MIGRATION_DATABASE_URL/RECONCILER_DATABASE_URL values
into a values file (TS-CONFIG-1).
*/}}
{{- if and (not .Values.existingSecret) (not .Values.database.existingSecretName) }}
{{- range list "DATABASE_URL" "MIGRATION_DATABASE_URL" "RECONCILER_DATABASE_URL" }}
{{- if not (index $.Values.secretValues .) }}
{{- fail (printf "secretValues.%s is required when existingSecret/database.existingSecretName is unset — see values.yaml" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iam-token-service.secretName" . }}
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
  # Survives `helm uninstall` — a self-managed Secret's credential values
  # are not something an accidental release deletion should destroy.
  annotations:
    helm.sh/resource-policy: keep
    {{- if .Values.migrations.enabled }}
    # The migrate Job (a pre-install hook) reads DATABASE_URL and
    # MIGRATION_DATABASE_URL from this Secret, and on a first install it
    # runs before any ordinary release resource exists. So the Secret is
    # itself a pre-install/pre-upgrade hook at weight -10 — one object, not
    # a hook copy beside a release copy, so the two can never drift or
    # collide on the name. Hooks are never deleted by `helm uninstall`
    # (same outcome as resource-policy: keep above). This path is the
    # local/dev convenience; real environments use existingSecret.
    {{- include "iam-token-service.migrateHookPrereqAnnotations" . | nindent 4 }}
    # Helm stamps these ownership annotations only on ordinary release
    # resources, never on hooks. Set by hand here so a later render with
    # migrations.enabled: false (this Secret then an ordinary resource) adopts
    # the existing object instead of failing with "exists and cannot be
    # imported into the current release". Rollback and existingSecret
    # caveats: values.yaml secretValues.
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    {{- end }}
type: Opaque
stringData:
  {{- toYaml .Values.secretValues | nindent 2 }}
{{- end }}
