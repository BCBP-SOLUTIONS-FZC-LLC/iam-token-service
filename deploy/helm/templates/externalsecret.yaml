{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "iam-token-service.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.externalSecret.targetSecretName | default (printf "%s-db-credentials" (include "iam-token-service.fullname" .)) }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.secretPath }}
        property: DATABASE_URL
    - secretKey: MIGRATION_DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.secretPath }}
        property: MIGRATION_DATABASE_URL
    - secretKey: RECONCILER_DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.secretPath }}
        property: RECONCILER_DATABASE_URL
{{- end }}
