{{/*
Optional L7 restriction (Istio AuthorizationPolicy). NetworkPolicy has no
path-level granularity, so the namespaces it admits only for one route —
Keycloak (EXT-6 JWKS fetch), Workflow (TS-6, TS-D17), and Tender (TS-6,
TND-Q23) — could otherwise call every route on the HTTP port, protected only
by the reserved x-user-id header (LLD §5.2). With a mesh, this policy narrows
each source to its one route; the mesh callers (RP, O&M, operator gateway) keep
every route EXCEPT TS-7, which is admitted only for the Realm Provisioner's own
ServiceAccount principal(s) (revokeCallerPrincipals — its orphaned-signup-reap
job is the only caller). Revocation is terminal, so it is not left to the
forgeable x-user-id header alone.
The x-user-id header is not a boundary on its own (any caller can set it), so
this policy is required outside local/dev/test whenever networkPolicy is on
(templates/validate.yaml). source.namespaces matches only mTLS-authenticated
peers: every caller, Keycloak included, must be in the mesh.
*/}}
{{- if .Values.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "iam-token-service.fullname" . }}-server
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  action: ALLOW
  rules:
    # In-mesh callers (Realm Provisioner, O&M, operator gateway): every route
    # except TS-7. The suffix is unique to TS-7 (TS-2 ends
    # …/credentials/:version/revoke).
    - from:
        - source:
            namespaces: {{ required "authorizationPolicy.meshNamespaces is required when authorizationPolicy.enabled" .Values.authorizationPolicy.meshNamespaces | toJson }}
      to:
        - operation:
            notPaths: ["*/service-accounts/platform-automation/revoke"]
    # TS-7 (revoke the tenant's automation principal, TS-D29): the Realm
    # Provisioner's ServiceAccount only — its server and its reconciler
    # CronJob share it. Principals match only mTLS-authenticated peers, so the
    # reconciler pod must be in the mesh (RP chart cronjobs.istioInject).
    - from:
        - source:
            principals: {{ required "authorizationPolicy.revokeCallerPrincipals is required when authorizationPolicy.enabled (TS-7 would be unreachable)" .Values.authorizationPolicy.revokeCallerPrincipals | toJson }}
      to:
        - operation:
            methods: ["POST"]
            paths: ["*/service-accounts/platform-automation/revoke"]
    # Keycloak: the JWKS route only.
    {{- with .Values.authorizationPolicy.keycloakNamespaces }}
    - from:
        - source:
            namespaces: {{ . | toJson }}
      to:
        - operation:
            methods: ["GET"]
            # Istio allows "*" only as a prefix or suffix, so the route is
            # matched by its suffix (the tenant id is the variable segment).
            paths: ["*/service-accounts/platform-automation/jwks.json"]
    {{- end }}
    # Workflow services (Execution API, connector workers): TS-6 only. The
    # path is a suffix match and the method is GET, so TS-7 (POST
    # …/platform-automation/revoke) and every other route stay out of reach.
    {{- with .Values.authorizationPolicy.workflowNamespaces }}
    - from:
        - source:
            namespaces: {{ . | toJson }}
      to:
        - operation:
            methods: ["GET"]
            paths: ["*/service-accounts/platform-automation"]
    {{- end }}
    # Tender Service: TS-6 only (Automation-mode principal resolution, TND-Q23,
    # Tender HLD §8.5/§14.1). Same GET-only suffix match as Workflow above —
    # TS-7 POST …/platform-automation/revoke stays out of reach.
    {{- with .Values.authorizationPolicy.tenderNamespaces }}
    - from:
        - source:
            namespaces: {{ . | toJson }}
      to:
        - operation:
            methods: ["GET"]
            paths: ["*/service-accounts/platform-automation"]
    {{- end }}
    # Probes and scraping (kubelet / Prometheus) on the non-API paths.
    - to:
        - operation:
            paths: ["/healthz", "/readyz", "/metrics"]
{{- if .Values.authorizationPolicy.strictMTLS }}
---
# STRICT mTLS on the server (authorizationPolicy.strictMTLS): a plaintext,
# non-mesh caller is rejected at the TLS layer on every port but metrics, so
# the policy above cannot be bypassed by a pod that simply never joined the
# mesh. The metrics port stays PERMISSIVE for a non-mesh Prometheus
# (NetworkPolicy already limits that port to the monitoring namespace).
# Kubelet probes are rewritten by Istio to the sidecar's own port, so they are
# unaffected.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "iam-token-service.fullname" . }}-server
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  mtls:
    mode: STRICT
  portLevelMtls:
    {{ .Values.service.metricsPort | quote }}:
      mode: PERMISSIVE
{{- end }}
{{- end }}
