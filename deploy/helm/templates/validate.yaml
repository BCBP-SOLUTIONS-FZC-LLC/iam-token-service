{{/*
Render-time guards that span several templates. Renders nothing; each check
fails the install/upgrade with a message saying what to set and why. The
per-template guards (networkPolicy selectors, secretValues) stay next to the
resource they protect.

"Non-dev" means appEnv is not one of local | dev | test — i.e. staging and
prod, the environments that must carry the production safety posture.
*/}}
{{- $devEnvs := list "local" "dev" "development" "test" }}
{{- $nonDev := not (has .Values.appEnv $devEnvs) }}

{{- /* Finding: Keycloak/Workflow could forge the system principal. NetworkPolicy
admits their namespaces to the whole HTTP port, and the only identity check on
the API routes is the reserved x-user-id header, which any caller can set. The
Istio AuthorizationPolicy is what restricts them to their one route each. */}}
{{- /* Not gated on networkPolicy.enabled: with NetworkPolicy off every pod in
the cluster reaches the port, which is strictly worse. */}}
{{- if and $nonDev (not .Values.authorizationPolicy.enabled) }}
{{- fail (printf "authorizationPolicy.enabled must be true when appEnv=%q (not local/dev/test): NetworkPolicy (when enabled) admits the Keycloak (and Workflow) namespaces to the server's whole HTTP port, and the API routes authenticate only by the x-user-id header, which any pod there can set — so without the Istio AuthorizationPolicy a pod in the Keycloak namespace can call TS-1/TS-2/TS-4 as the system principal. Enable authorizationPolicy (Keycloak must be in the mesh) and set its meshNamespaces/keycloakNamespaces. See values.yaml." .Values.appEnv) }}
{{- end }}
{{- if .Values.authorizationPolicy.enabled }}
{{- if not .Values.authorizationPolicy.meshNamespaces }}
{{- fail "authorizationPolicy.meshNamespaces is required when authorizationPolicy.enabled is true — it lists the namespaces of the Realm Provisioner, O&M and the operator gateway, the only callers allowed on every route; without it the ALLOW policy denies them all. See values.yaml." }}
{{- end }}
{{- if not .Values.authorizationPolicy.keycloakNamespaces }}
{{- fail "authorizationPolicy.keycloakNamespaces is required when authorizationPolicy.enabled is true — without it Keycloak's JWKS fetch (EXT-6) is denied and every platform-automation client-jwt login fails. Keycloak must also be in the mesh (mTLS), since source.namespaces matches only authenticated peers. See values.yaml." }}
{{- end }}
{{- end }}

{{- /* Production-required values: an empty value here silently degrades to a
no-op publisher / a consumer that cannot start, or exposes unauthenticated
docs. */}}
{{- if $nonDev }}
{{- if not .Values.events.topicArn }}
{{- fail (printf "events.topicArn is required when appEnv=%q (not local/dev/test) — without SNS_TOPIC_ARN the server publishes credential-lifecycle events to a no-op publisher and they are lost. See values.yaml." .Values.appEnv) }}
{{- end }}
{{- /* TS-RP-GAP-003: Glue schema registry must be registered and AVAILABLE
     before this chart is installed — NewGlueCodec resolves each produced
     schema's version UUID at startup and crashes the pod if any is missing,
     so a deploy that outran schema registration causes a boot loop. Run
     `make schema-register GLUE_REGISTRY_SERVICEACCOUNT_NAME=<registry>`
     (or wait for the schema-registry CI job) before `helm upgrade`. */}}
{{- if not .Values.events.glueRegistryName }}
{{- fail (printf "events.glueRegistryName is required when appEnv=%q (not local/dev/test) — without GLUE_REGISTRY_NAME the server cannot resolve Glue schema version UUIDs at startup and will crash. Ensure all %d produced schemas are registered and AVAILABLE in the registry first (make schema-verify), then set this value. See TS-RP-GAP-003 and NOTES.txt." .Values.appEnv 5) }}
{{- end }}
{{- if not .Values.sqs.queueUrl }}
{{- fail (printf "sqs.queueUrl is required when appEnv=%q (not local/dev/test) — without SQS_QUEUE_URL the consumer cannot read TenantMembershipsPurged and tenant offboarding never revokes credentials. See values.yaml." .Values.appEnv) }}
{{- end }}
{{- if and .Values.docs.enabled (not .Values.docs.authEnabled) }}
{{- fail (printf "docs.enabled requires docs.authEnabled when appEnv=%q (not local/dev/test) — the Swagger/AsyncAPI docs would otherwise be served unauthenticated (the server also refuses to start without DOCS_AUTH_TOKEN). Set docs.authEnabled: true and provide DOCS_AUTH_TOKEN in the Secret, or disable docs. See values.yaml." .Values.appEnv) }}
{{- end }}
{{- end }}

{{- /* One shared ServiceAccount means one IRSA role for every workload:
per-workload annotations would be silently dropped. The migrate hook Job
always has its own ServiceAccount (serviceaccount.yaml), so a `migrate` key
still applies and is ignored here. */}}
{{- if and (not .Values.serviceAccount.perWorkload) (omit (.Values.serviceAccount.workloadAnnotations | default dict) "migrate") }}
{{- fail "serviceAccount.workloadAnnotations is set but serviceAccount.perWorkload is false — every workload then shares one ServiceAccount, so per-workload annotations (IRSA roles) cannot apply. Put the union IRSA role in serviceAccount.annotations and remove workloadAnnotations, or set perWorkload: true. See values.yaml." }}
{{- end }}

{{- /* H-3: Inline DB credentials must never appear outside local/dev/test —
     secretValues is rendered verbatim into a Kubernetes Secret whose data
     is base64, not encrypted, and Helm stores the full rendered manifest in
     a release Secret (also base64, not encrypted). Any staging/prod deploy
     with secretValues set has plaintext credentials in release history. */}}
{{- if and $nonDev .Values.secretValues }}
{{- fail "secretValues must not be used in non-dev environments: use existingSecret or database.existingSecretName to reference a pre-provisioned Kubernetes Secret or use ExternalSecretOperator. Plain-text credentials in Helm values are stored unencrypted in release history." }}
{{- end }}

{{- /* M-15: NetworkPolicy must not be disabled outside local/dev/test —
     without it every pod in the cluster can reach every other pod, which
     eliminates the network-layer isolation that AuthorizationPolicy depends
     on (NetworkPolicy admits at L4; AuthorizationPolicy filters at L7). */}}
{{- if and $nonDev (not .Values.networkPolicy.enabled) }}
{{- fail "networkPolicy.enabled must not be false in non-dev environments: network policies are required for security isolation. Set networkPolicy.enabled=true and configure meshNamespaces/keycloakNamespaces." }}
{{- end }}

{{- /* L-12: image.digest must be set outside local/dev/test — a tag-only
     deploy is mutable: the same tag can be overwritten at the registry,
     making the deployment non-reproducible and bypassing image signing. */}}
{{- if and $nonDev (or (not .Values.image.digest) (not (hasPrefix .Values.image.digest "sha256:"))) }}
{{- fail "image.digest must be a content digest (sha256:<hash>) in non-dev environments: a tag value is mutable and can be overwritten at the registry, bypassing image signing. Set image.digest to the sha256 digest output by your CI build." }}
{{- end }}

{{- /* L-13: IRSA annotations must be present outside local/dev/test —
     without them the server pod has no AWS identity (SNS, Glue) and the
     consumer pod has no AWS identity (SQS), causing silent publish failures
     and consumer startup errors. Only checked when perWorkload: true (the
     per-workload annotations path); with perWorkload: false the union role
     belongs in serviceAccount.annotations, which is not checked here. */}}
{{- if and $nonDev .Values.serviceAccount.perWorkload }}
{{- if not (index (.Values.serviceAccount.workloadAnnotations | default dict) "server") }}
{{- fail "serviceAccount.workloadAnnotations.server must be set in non-dev environments: without IRSA annotations the server pod cannot authenticate to AWS (SNS, Glue)." }}
{{- end }}
{{- if not (index (.Values.serviceAccount.workloadAnnotations | default dict) "consumer") }}
{{- fail "serviceAccount.workloadAnnotations.consumer must be set in non-dev environments: without IRSA annotations the consumer pod cannot authenticate to AWS (SQS)." }}
{{- end }}
{{- end }}
