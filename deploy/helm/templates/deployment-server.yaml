apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iam-token-service.fullname" . }}-server
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted when the HPA owns the replica count, so `helm upgrade` does not
  # reset it.
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  # No local disk state and no long-running in-flight work beyond a single
  # HTTP request or outbox-publish batch, but maxSurge: 0 with pod
  # anti-affinity below still means a rolling update never has 0 AND never
  # exceeds replicaCount pods scheduled at once (§13.2 — HA, not throughput).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- include "iam-token-service.secretRestartAnnotation" . | nindent 8 }}
        {{- include "iam-token-service.meshPodAnnotations" (dict "grace" (.Values.server.terminationGracePeriodSeconds | default 80) "root" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "iam-token-service.workloadServiceAccountName" (dict "component" "server" "root" $) }}
      # Covers SHUTDOWN_DRAIN_DELAY + HTTP drain (30s) + outbox drain (30s)
      # + pool drain, so a rollout never SIGKILLs a publish mid-flight.
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds | default 80 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Spreads server replicas across nodes so a single node loss/drain
      # cannot take out more than one replica at a time — matches
      # maxUnavailable: 1 above (§13.2 HA). Hard (required) for the fixed
      # replicaCount; preferred under the HPA, which may scale past the
      # node count — a hard rule would leave the extra replicas Pending.
      affinity:
        podAntiAffinity:
          {{- if .Values.autoscaling.enabled }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 20 }}
                topologyKey: kubernetes.io/hostname
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- end }}
      # And across zones, best effort: hostname anti-affinity alone allows
      # both replicas in one AZ.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "iam-token-service.componentSelectorLabels" (dict "component" "server" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 14 }}
      containers:
        - name: server
          image: {{ include "iam-token-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/iam-token-service-server"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            {{- include "iam-token-service.commonEnv" . | nindent 12 }}
            {{- include "iam-token-service.reconcilerDBEnv" . | nindent 12 }}
            - name: GOMEMLIMIT
              value: {{ .Values.server.goMemLimit | quote }}
            - name: APP_PORT
              value: {{ .Values.service.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: ROTATION_DEFAULT_OVERLAP_SECONDS
              value: {{ .Values.rotation.defaultOverlapSeconds | quote }}
            - name: ROTATION_DEFAULT_CADENCE_DAYS
              value: {{ .Values.rotation.defaultCadenceDays | quote }}
            - name: JWKS_RATE_LIMIT_RPS
              value: {{ .Values.jwks.rateLimitRPS | quote }}
            - name: JWKS_RATE_LIMIT_BURST
              value: {{ .Values.jwks.rateLimitBurst | quote }}
            - name: JWKS_RATE_LIMIT_PER_TENANT_RPS
              value: {{ .Values.jwks.perTenantRPS | quote }}
            - name: JWKS_RATE_LIMIT_PER_TENANT_BURST
              value: {{ .Values.jwks.perTenantBurst | quote }}
            - name: JWKS_RATE_LIMIT_UNKNOWN_TENANT_RPS
              value: {{ .Values.jwks.unknownTenantRPS | default 2 | quote }}
            - name: JWKS_RATE_LIMIT_UNKNOWN_TENANT_BURST
              value: {{ .Values.jwks.unknownTenantBurst | default 5 | quote }}
            - name: JWKS_KNOWN_TENANTS_REFRESH
              value: {{ .Values.jwks.knownTenantsRefresh | default "15s" | quote }}
            - name: ROTATION_REPLAY_WINDOW
              value: {{ .Values.rotation.replayWindow | default "15m" | quote }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.shutdown.drainDelay | quote }}
            - name: GLUE_REGISTRY_NAME
              value: {{ .Values.events.glueRegistryName | quote }}
            - name: AWS_REGION
              value: {{ .Values.events.awsRegion | quote }}
            - name: SNS_TOPIC_ARN
              value: {{ .Values.events.topicArn | quote }}
            - name: PG_STATEMENT_TIMEOUT
              value: {{ .Values.database.pool.statementTimeout | quote }}
            - name: ROTATION_OVERLAP_GAUGE_INTERVAL
              value: {{ .Values.exporters.rotationOverlapInterval | quote }}
            - name: RLS_VIOLATION_EXPORTER_INTERVAL
              value: {{ .Values.exporters.rlsViolationInterval | quote }}
            - name: KEYS_REFRESH_EXPORTER_INTERVAL
              value: {{ .Values.exporters.keysRefreshInterval | default "30s" | quote }}
            - name: OUTBOX_POLL_INTERVAL
              value: {{ .Values.outbox.pollInterval | quote }}
            - name: OUTBOX_BATCH_SIZE
              value: {{ .Values.outbox.batchSize | quote }}
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.outbox.maxAttempts | quote }}
            - name: OUTBOX_DRAIN_TIMEOUT
              value: {{ .Values.outbox.drainTimeout | quote }}
            - name: OUTBOX_PUBLISH_CONCURRENCY
              value: {{ .Values.outbox.publishConcurrency | quote }}
            - name: OUTBOX_PUBLISH_TIMEOUT
              value: {{ .Values.outbox.publishTimeout | quote }}
            - name: OUTBOX_STARTUP_JITTER
              value: {{ .Values.outbox.startupJitter | quote }}
            - name: OUTBOX_CLAIM_LEASE_DURATION
              value: {{ .Values.outbox.claimLeaseDuration | quote }}
            - name: DOCS_ENABLED
              value: {{ .Values.docs.enabled | quote }}
            {{- if .Values.docs.authEnabled }}
            - name: DOCS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecretName | default (include "iam-token-service.secretName" .) }}
                  key: DOCS_AUTH_TOKEN
            {{- end }}
          # Covers a slow cold start (Postgres pool warmup, OpenBao
          # Kubernetes-auth login) before liveness/readiness take over.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 0
            periodSeconds: 10
            # Above the handler's own 2s per-check bound (readinessCheckTimeout),
            # so a slow dependency answers 503 from /readyz rather than the
            # kubelet timing out the probe at the 1s default.
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "iam-token-service.openbaoVolumeMounts" . | trim | nindent 12 }}
      # Required under securityContext.readOnlyRootFilesystem: true — any
      # incidental temp-file write (e.g. Go's os.CreateTemp) needs a writable
      # path.
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "iam-token-service.openbaoVolumes" . | trim | nindent 8 }}
