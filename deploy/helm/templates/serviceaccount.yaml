{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iam-token-service.serviceAccountName" . }}
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# REQUIRED, not just default: OpenBao's Kubernetes auth method
# (internal/adapter/outbound/openbao/client.go's token()) reads this pod's
# own projected ServiceAccount token at
# /var/run/secrets/kubernetes.io/serviceaccount/token at runtime (§10.5,
# TS-CONFIG-3) — every workload this chart creates (server, consumer,
# rotator) depends on this being true.
automountServiceAccountToken: true
{{- end }}
