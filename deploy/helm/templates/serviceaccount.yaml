{{- if .Values.serviceAccount.create }}
{{- $root := . }}
{{- $components := list "server" "consumer" "rotator" "scheduler" }}
{{- if not .Values.serviceAccount.perWorkload }}{{ $components = list "" }}{{ end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if $component }}
  name: {{ include "iam-token-service.workloadServiceAccountName" (dict "component" $component "root" $root) }}
  {{- else }}
  name: {{ include "iam-token-service.serviceAccountName" $root }}
  {{- end }}
  labels:
    {{- include "iam-token-service.labels" $root | nindent 4 }}
    {{- if $component }}
    app.kubernetes.io/component: {{ $component }}
    {{- end }}
  {{- $annotations := merge (dict) (get ($root.Values.serviceAccount.workloadAnnotations | default dict) $component | default dict) ($root.Values.serviceAccount.annotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# REQUIRED, not just default: OpenBao's Kubernetes auth method
# (internal/adapter/outbound/openbao/client.go's token()) reads this pod's
# own ServiceAccount token at runtime (§10.5, TS-CONFIG-3) — every workload
# this chart creates depends on it.
automountServiceAccountToken: true
{{- end }}
{{- if .Values.migrations.enabled }}
---
# The migrate Job's own ServiceAccount, as a pre-install/pre-upgrade hook:
# the Job runs before any ordinary release resource exists on a first
# install, so a ServiceAccount rendered like the ones above would not exist
# yet. Always <fullname>-migrate (perWorkload true or false), so it never
# collides with the shared or per-workload ServiceAccounts above. The Job
# reaches only Postgres (no OpenBao, no AWS), so it needs no token mount and
# carries no IRSA annotation from the shared `annotations` — only
# workloadAnnotations.migrate, if set.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iam-token-service.migrateServiceAccountName" . }}
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- include "iam-token-service.migrateHookPrereqAnnotations" . | nindent 4 }}
    {{- with (get (.Values.serviceAccount.workloadAnnotations | default dict) "migrate") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
