# The overlap-expiry sweep (§8.3), orphan-material reconciler (§8.6), and
# outbox/processed_events prune (§4.2/§13.1) — one CronJob, one binary
# invocation per fire, running all three tasks then exiting (see
# cmd/rotator's package doc comment for why the reconciler/prune tasks run
# on this same 5-minute cadence rather than their own "default hourly").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "iam-token-service.fullname" . }}-rotator
  labels:
    {{- include "iam-token-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: rotator
spec:
  schedule: {{ .Values.rotator.schedule | quote }}
  concurrencyPolicy: {{ .Values.rotator.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.rotator.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.rotator.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.rotator.activeDeadlineSeconds }}
      # A crashing rotator retries at most twice before the Job is marked
      # Failed rather than looping indefinitely within one 5-minute tick —
      # the next scheduled fire (concurrencyPolicy: Forbid) picks up where
      # this one left off, since every task the rotator runs is idempotent.
      backoffLimit: 2
      # Exit code 1 is the binary's deliberate "run failed / page-worthy
      # divergence" signal: fail the Job at once instead of re-running the
      # whole batch twice (3x OpenBao and RP-17 load on a persistent fault).
      # Crashes and node disruptions are still retried.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: rotator
              operator: In
              values: [1]
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
      template:
        metadata:
          labels:
            {{- include "iam-token-service.componentSelectorLabels" (dict "component" "rotator" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 12 }}
          annotations:
            {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # Pod-level scrape annotation: this Job's iam_token_service_
            # rotation_sweep_total / material_reconcile_total samples are
            # only ever available during serveMetricsBriefly's grace
            # window (see cmd/rotator/main.go) — there is no Pushgateway
            # in this deployment.
            prometheus.io/scrape: "true"
            prometheus.io/port: {{ .Values.service.metricsPort | quote }}
            prometheus.io/path: /metrics
            {{- include "iam-token-service.cronjobIstioAnnotations" . | nindent 12 }}
            {{- include "iam-token-service.secretRestartAnnotation" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "iam-token-service.workloadServiceAccountName" (dict "component" "rotator" "root" $) }}
          restartPolicy: Never
          # On SIGTERM the binary finishes the current tenant — its row
          # reserve (20s) plus its RP-17 call (10s) — then exits; this covers
          # both, so a node drain never cuts a rotate/revoke off from its
          # RP-17 key-cache refresh.
          terminationGracePeriodSeconds: {{ .Values.rotator.terminationGracePeriodSeconds | default 45 }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: rotator
              image: {{ include "iam-token-service.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/iam-token-service-rotator"]
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              ports:
                - name: metrics
                  containerPort: {{ .Values.service.metricsPort }}
              env:
                {{- include "iam-token-service.commonEnv" . | nindent 16 }}
                {{- include "iam-token-service.reconcilerDBEnv" . | nindent 16 }}
                - name: GOMEMLIMIT
                  value: {{ .Values.rotator.goMemLimit | quote }}
                - name: METRICS_PORT
                  value: {{ .Values.service.metricsPort | quote }}
                - name: PROCESSED_EVENTS_TTL_DAYS
                  value: {{ .Values.processedEvents.ttlDays | quote }}
                - name: RLS_VIOLATION_LOG_TTL_DAYS
                  value: {{ .Values.rlsViolationLog.ttlDays | default 30 | quote }}
                - name: REALM_PROVISIONER_BASE_URL
                  value: {{ .Values.realmProvisioner.baseUrl | quote }}
                - name: ROTATOR_BATCH_LIMIT
                  value: {{ .Values.rotator.batchLimit | quote }}
                - name: PG_STATEMENT_TIMEOUT
                  value: {{ .Values.database.pool.jobStatementTimeout | quote }}
                - name: ROTATOR_RUN_TIMEOUT
                  value: {{ .Values.rotator.runTimeout | quote }}
                - name: ROTATOR_METRICS_SCRAPE_GRACE
                  value: {{ .Values.rotator.metricsScrapeGrace | quote }}
                - name: PRUNE_BATCH_LIMIT
                  value: {{ .Values.rotator.pruneBatchLimit | quote }}
                - name: OUTBOX_PRUNE_OLDER_THAN
                  value: {{ .Values.rotator.outboxPruneOlderThan | quote }}
              resources:
                {{- toYaml .Values.rotator.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- include "iam-token-service.openbaoVolumeMounts" . | trim | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- include "iam-token-service.openbaoVolumes" . | trim | nindent 12 }}
