# Default values for iam-token-service (§12).

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/iam-token-service
  tag: "" # defaults to .Chart.AppVersion
  # digest (e.g. "sha256:…") pins every workload to the exact image the
  # release pipeline scanned and signed; when set it wins over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # perWorkload: one ServiceAccount per binary (<fullname>-server, -consumer,
  # -rotator, -scheduler, -migrate) so each gets its own IRSA role and
  # OpenBao role with only its permissions (deploy/iam/policy-{server,consumer}.json,
  # deploy/openbao/role.tf.example). false = one shared ServiceAccount
  # (<fullname>, or `name`) for server/consumer/rotator/scheduler — then:
  #   - the OpenBao role must bind THAT shared name too
  #     (bound_service_account_names in deploy/openbao/role.tf.example),
  #     or every workload's OpenBao login fails with "service account name
  #     not authorized";
  #   - IRSA is one role for all four, so `annotations` below must carry the
  #     UNION role (server's SNS/Glue + consumer's SQS permissions,
  #     deploy/iam/policy-{server,consumer}.json); workloadAnnotations is
  #     ignored and the render fails if it sets any key but `migrate`.
  # The migrate hook Job always gets its own <fullname>-migrate ServiceAccount
  # (a pre-install hook, so it exists before the Job on a first install).
  # workloadAnnotations.migrate applies to it either way.
  perWorkload: true
  # Per-workload annotations, merged over `annotations` below — typically
  # each workload's IRSA role (perWorkload: true only):
  #   workloadAnnotations:
  #     server:   {eks.amazonaws.com/role-arn: arn:aws:iam::…:role/iam-token-service-server}
  #     consumer: {eks.amazonaws.com/role-arn: arn:aws:iam::…:role/iam-token-service-consumer}
  workloadAnnotations: {}
  # annotations carries IRSA (IAM Roles for Service Accounts) — this pod
  # identity is used for AWS access (Glue/SNS/SQS via OIDC, §13.5); OpenBao
  # access is separately via its own Kubernetes auth method (§10.5,
  # TS-CONFIG-3), not this annotation.
  annotations: {}

podAnnotations: {}
podSecurityContext:
  # RuntimeDefault seccomp — required by Pod Security Admission "restricted".
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

server:
  replicaCount: 2 # HA, not throughput (§13.2/§21)
  # SHUTDOWN_DRAIN_DELAY (5s) + HTTP drain (30s) + outbox drain (30s) + pool drain.
  terminationGracePeriodSeconds: 80
  # GOMEMLIMIT ≈ 85-90% of the memory limit, so the GC works before the
  # container is OOM-killed.
  goMemLimit: "220MiB"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

consumer:
  replicaCount: 2
  # SHUTDOWN_DRAIN_DELAY (5s) + SQS drain (15s) + server drain + pool drain.
  terminationGracePeriodSeconds: 60
  goMemLimit: "110MiB"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

rotator:
  schedule: "*/5 * * * *" # CronJob schedule (§8.3; Helm-only, no env var) — also drives the reconciler/prune tasks, see cmd/rotator's package doc
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Deliberately shorter than the 300s (5m) schedule interval, not equal to
  # it: with concurrencyPolicy: Forbid, a run that legitimately used its
  # entire budget would leave zero slack before the next scheduled tick,
  # silently skipping it. 240s leaves a 60s margin.
  activeDeadlineSeconds: 240
  # ROTATOR_RUN_TIMEOUT + ROTATOR_METRICS_SCRAPE_GRACE must stay under
  # activeDeadlineSeconds, so the graceful in-process exit (summary log,
  # /metrics scrape window, pool drain) always wins over the k8s kill.
  runTimeout: "180s"
  metricsScrapeGrace: "15s"
  # ROTATOR_BATCH_LIMIT: expired rotating rows revoked per run (oldest
  # first); a larger backlog is picked up by the next run.
  batchLimit: 500
  goMemLimit: "110MiB"
  # PRUNE_BATCH_LIMIT (processed_events, rls_violation_log, outbox batches)
  # and OUTBOX_PRUNE_OLDER_THAN (published outbox_events retention).
  pruneBatchLimit: 10000
  outboxPruneOlderThan: "168h"
  # On SIGTERM the binary finishes the current tenant (its row reserve, 20s,
  # plus its RP-17 call, 10s) before exiting; 45s covers both with margin.
  terminationGracePeriodSeconds: 45
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# scheduler: the §16 TSQ-6 Resolved automatic cadence-driven rotation scan
# (TS-D14) — a separate CronJob from rotator above; rotator never calls
# TS-1 and never will.
scheduler:
  schedule: "*/5 * * * *" # ROTATION_SCHEDULER_POLL_INTERVAL semantics (§16 TSQ-6 Resolved) — a Helm-level cron expression, not an env var this binary reads
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 240
  # SCHEDULER_RUN_TIMEOUT + SCHEDULER_METRICS_SCRAPE_GRACE < activeDeadlineSeconds.
  runTimeout: "180s"
  metricsScrapeGrace: "15s"
  # SCHEDULER_BATCH_LIMIT: due rotations per run (most overdue first).
  batchLimit: 500
  goMemLimit: "110MiB"
  # On SIGTERM the binary finishes the current tenant (its row reserve, 20s,
  # plus its RP-17 call, 10s) before exiting; 45s covers both with margin.
  terminationGracePeriodSeconds: 45
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# migrations: schema migrations run once per release in a pre-install /
# pre-upgrade hook Job (templates/job-migrate.yaml) instead of at every pod
# start; workloads get RUN_MIGRATIONS=false and never see the migrator DSN.
# false = every workload migrates at startup (and holds that DSN).
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# shutdown: SHUTDOWN_DRAIN_DELAY — on SIGTERM the server and consumer report
# not-ready and keep serving this long before closing their listeners, so
# endpoint removal propagates before connections are refused.
shutdown:
  drainDelay: "5s"

# cronjobs: Istio sidecar injection for the rotator and scheduler CronJob
# pods. Default false: a classic sidecar never exits, so the Job would never
# complete, and these pods' only in-mesh call is RP-17 to the Realm
# Provisioner. Trade-off: if the Realm Provisioner enforces STRICT mTLS (or an
# AuthorizationPolicy on source principals/namespaces), a non-injected pod
# cannot reach RP-17 and every rotate/revoke leaves an owed refresh in
# keys_refresh_pending. Set true in that case; the pods are then injected as a
# native sidecar (sidecar.istio.io/nativeSidecar, Istio >= 1.20 on Kubernetes
# >= 1.29), which ends with the main container so the Job still completes.
# The migrate hook Job is never injected (Postgres only, nothing in-mesh).
cronjobs:
  istioInject: false

# exporters: the server's DB-state exporters over the BYPASSRLS reconciler
# pool — ROTATION_OVERLAP_GAUGE_INTERVAL (iam_token_service_rotation_overlap_active)
# and RLS_VIOLATION_EXPORTER_INTERVAL (iam_rls_violations_total).
exporters:
  rotationOverlapInterval: "30s"
  rlsViolationInterval: "1m"
  # KEYS_REFRESH_EXPORTER_INTERVAL: iam_token_service_keys_refresh_pending /
  # _oldest_age_seconds, the owed-RP-17 backlog
  # (IAMTokenServiceKeysRefreshBacklog alerts on the age).
  keysRefreshInterval: "30s"

service:
  port: 8080
  metricsPort: 9090

# HPA — disabled by default. This service's traffic today is a small,
# predictable set of internal-only callers (Realm Provisioner, O&M, the
# operator gateway, §5.6) with no public surface, so a fixed replicaCount
# (server.replicaCount) is the current model; kept here as dormant
# scaffolding matching the sibling IAM services' chart shape, for if load
# ever warrants autoscaling.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  targetRPSPerReplica: 500

# Restricts ingress to in-mesh callers only (§10.2) — Realm Provisioner,
# O&M, the operator gateway, and this service's own rotator/scheduler
# CronJobs (which never call the server's HTTP API, but share the mesh),
# PLUS Keycloak (TS-D15, EXT-6/rev 1.3) for its own outbound JWKS fetch —
# see keycloakNamespaceSelector below. No public/edge route exists (§5.6).
# Egress is an explicit allow-list (DNS, Postgres, OpenBao, AWS HTTPS for
# SNS/Glue, OTel, and — for rotator/scheduler only — the Realm
# Provisioner's RP-17) shared by every workload this chart creates
# (server, consumer, rotator, scheduler) — see templates/_helpers.tpl's
# egressRules.
networkPolicy:
  enabled: true
  # Required whenever enabled: true — a NetworkPolicy `namespaceSelector: {}`
  # matches every namespace in the cluster, which is NOT a mesh-scoped
  # restriction, it is no restriction at all. There is no safe default here
  # (templates/networkpolicy.yaml fails the render if this is left empty),
  # so every real install must set it to a real label selector, e.g.:
  #   ingressNamespaceSelector:
  #     matchLabels:
  #       mesh: iam
  # matching whatever namespace label your mesh/cluster convention uses for
  # "in-mesh" namespaces (Realm Provisioner, O&M, the operator gateway).
  ingressNamespaceSelector: {}
  # Required whenever enabled: true, same fail-closed posture as
  # ingressNamespaceSelector above (TS-D15, EXT-6/rev 1.3 completeness
  # fix) — Keycloak's own outbound client-jwt/jwks.url fetch against the
  # platform-automation JWKS route carries no caller identity, so it
  # can't be authenticated by header the way every other route on this
  # port is; it must be admitted at the network layer instead, separately
  # from ingressNamespaceSelector since Keycloak may not run in the same
  # namespace as the RP/O&M/operator mesh, e.g.:
  #   keycloakNamespaceSelector:
  #     matchLabels:
  #       app: keycloak
  keycloakNamespaceSelector: {}
  # Optional (TS-D17) — the Workflow Service's connector workers call TS-6
  # (GET .../service-accounts/platform-automation) to learn each tenant's
  # automation subject. Leave empty when Workflow already runs inside the
  # ingressNamespaceSelector namespaces; otherwise set it to Workflow's own
  # namespace, e.g.:
  #   workflowNamespaceSelector:
  #     matchLabels:
  #       app.kubernetes.io/part-of: workflow
  # This admits the whole HTTP port; authorizationPolicy below is what limits
  # Workflow to TS-6.
  workflowNamespaceSelector: {}
  # postgresPort: the port DATABASE_URL connects to (PgBouncer's, when
  # database.pgBouncerMode). postgresDirectPort: the port the direct, non-
  # PgBouncer DSNs connect to — RECONCILER_DATABASE_URL (the server's DB-state
  # exporters, the rotator, the scheduler) and MIGRATION_DATABASE_URL (the
  # migrate Job). Both are opened to postgresCIDRs; set them to the same value
  # when there is no PgBouncer.
  postgresPort: 5432
  postgresDirectPort: 5432
  openbaoPort: 8200
  otelPort: 4317
  # realmProvisionerPort: cmd/rotator's and cmd/scheduler's shared egress
  # target (RP-17, §16 TSQ-6 Resolved / TS-D15) — the overlap-expiry sweep
  # and the cadence scan both call ClearServiceAccountKeysCache after
  # every revoke/rotate (EXT-6/rev 1.3); no other workload in this chart
  # calls out to it.
  realmProvisionerPort: 8080
  # istiod egress (xDS + certificates) for the injected Istio sidecar — only
  # rendered when authorizationPolicy.enabled or cronjobs.istioInject. Adjust
  # the selector for a revisioned / non-default control-plane namespace.
  istiodNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: istio-system
  istiodPort: 15012
  # Prometheus scrape access (required when enabled): the metrics port only,
  # from the monitoring namespace — never from the mesh. Optionally narrowed
  # to the Prometheus pods, e.g.
  #   monitoringNamespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring
  #   monitoringPodSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: prometheus
  monitoringNamespaceSelector: {}
  monitoringPodSelector: {}
  # Off-cluster egress destinations. A namespaceSelector only ever matches
  # pods inside the cluster, so anything outside it — RDS, an external
  # OpenBao or OTel collector, NodeLocal DNSCache (169.254.20.10, host
  # network) — must be listed as CIDRs. postgresCIDRs is REQUIRED (the render
  # fails without it): every workload connects to Postgres at startup.
  egress:
    postgresCIDRs: []   # e.g. ["10.20.0.0/22"] — the RDS subnets
    openbaoCIDRs: []
    otelCIDRs: []
    dnsCIDRs: []        # e.g. ["169.254.20.10/32"] with NodeLocal DNSCache
  additionalEgressRules: []

# authorizationPolicy: Istio L7 policy for the server.
# NetworkPolicy admits Keycloak (and Workflow) at L4 to the WHOLE HTTP port,
# and the only identity check on TS-1..TS-6 is the reserved x-user-id header
# (LLD §5.2), which any caller can set — so without this policy a pod in the
# Keycloak/Workflow namespace can call TS-1/TS-2/TS-4 as the system
# principal. This policy limits Keycloak to GET …/jwks.json and Workflow to
# GET …/platform-automation (TS-6); only meshNamespaces get every route.
# REQUIRED (the render fails otherwise) when networkPolicy.enabled and appEnv
# is not local/dev/test.
# Keycloak MUST be in the mesh (sidecar-injected, mTLS to this server):
# `source.namespaces` matches only authenticated mTLS peers, so a plaintext
# request from a non-injected Keycloak has no namespace and is DENIED — its
# JWKS fetch fails and every platform-automation client-jwt login breaks.
# The same holds for the mesh and Workflow callers.
# An AuthorizationPolicy is enforced only by the server pod's own sidecar, so
# enabled: true also renders sidecar.istio.io/inject: "true" on the server and
# consumer pods — it does not depend on the namespace being labelled for
# injection (an uninjected server would silently ignore the policy).
# Their outbound traffic (Postgres, OpenBao, AWS, OTel) then passes through
# the proxy: under a mesh outboundTrafficPolicy of REGISTRY_ONLY those need
# ServiceEntries. NetworkPolicy egress to istiod is added automatically
# (networkPolicy.istiodNamespaceSelector / istiodPort).
authorizationPolicy:
  enabled: false
  meshNamespaces: []      # RP / O&M / operator gateway — every route (required when enabled)
  keycloakNamespaces: []  # JWKS route only (required when enabled)
  workflowNamespaces: []  # TS-6 only
  # strictMTLS: a STRICT PeerAuthentication on the server (enabled: true
  # only). Under the mesh-wide default (PERMISSIVE) the sidecar still accepts
  # plaintext; a plaintext request has no source namespace, so this ALLOW
  # policy already denies it on the API routes, but STRICT rejects it at the
  # TLS layer for every route, independent of how the rules are written. The
  # metrics port stays PERMISSIVE so a non-mesh Prometheus can still scrape
  # (NetworkPolicy limits that port to the monitoring namespace). Probes are
  # unaffected: Istio rewrites them to the sidecar's own port.
  strictMTLS: true
  # nativeSidecar: inject the proxy as a Kubernetes native sidecar
  # (sidecar.istio.io/nativeSidecar; Istio >= 1.20 on Kubernetes >= 1.29 —
  # the same requirement cronjobs.istioInject already has). A classic
  # sidecar starts its own ~5s drain on SIGTERM, in parallel with the app,
  # and then stops proxying outbound traffic — cutting the server's 30s
  # outbox drain (SNS) and the consumer's in-flight cascade (Postgres,
  # OpenBao) mid-flight. A native sidecar is stopped only after the app
  # container exits, so no drain timer has to be tuned against
  # terminationGracePeriodSeconds. false (older clusters): a classic sidecar
  # with proxy.istio.io/config terminationDrainDuration =
  # terminationGracePeriodSeconds - 10s, which keeps the proxy up for the
  # whole app drain.
  nativeSidecar: true

# podDisruptionBudget — ensures at least 1 pod survives voluntary
# disruptions (node drains, cluster upgrades) on each of the server and
# consumer Deployments. With replicaCount: 2 on both, keep minAvailable=1
# so a single node drain doesn't take either one to zero.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Ingress — disabled by default. No public/edge route exists today (§5.6,
# all 7 routes are /api/v1/internal/*, gated to in-mesh callers by
# networkPolicy and authorizationPolicy above); kept as dormant scaffolding matching the sibling
# IAM services' chart shape, for if that ever changes.
# type: HTTPRoute  — Envoy Gateway / any Gateway API-compatible controller (recommended)
# type: Ingress    — classic nginx / traefik Ingress controller
ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: iam-token-service.internal.example.com
      paths:
        - path: /api/v1/internal
          pathType: PathPrefix

  # Gateway API (type: HTTPRoute) — reference the Gateway resource that
  # Envoy Gateway manages. Deploy the Gateway separately.
  gateway:
    name: ""              # required — name of the Gateway resource
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  # Envoy Gateway SecurityPolicy — rate limiting (CORS is unlikely to ever
  # be needed — no browser-facing surface — kept for structural parity).
  # Requires gateway.envoyproxy.io/v1alpha1 CRD (Envoy Gateway v0.6+).
  securityPolicy:
    enabled: false
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - X-Tenant-ID
        - X-User-ID
      maxAge: "86400"
    rateLimit:
      enabled: false
      requestsPerUnit: 1000
      unit: Second          # Second | Minute | Hour

  # Classic Ingress (type: Ingress)
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  #  - secretName: iam-token-service-tls
  #    hosts:
  #      - iam-token-service.internal.example.com

# database: platform-pgcommon config (§4, §12). DATABASE_URL /
# MIGRATION_DATABASE_URL / RECONCILER_DATABASE_URL are supplied via
# externalSecretRef (ESO) or an existing Secret — never rendered in
# values.yaml or committed anywhere (TS-CONFIG-1).
database:
  pgBouncerMode: true
  existingSecretName: "" # must provide DATABASE_URL, MIGRATION_DATABASE_URL, RECONCILER_DATABASE_URL
  # platform-pgcommon pool settings (PG_*), the same set iam-org-membership
  # passes. Timeouts are applied per transaction (SET LOCAL) on both the
  # app pool and the BYPASSRLS reconciler pool; never to the migration DSN.
  pool:
    maxConns: 10             # PG_MAX_CONNS, per pool per pod — budget against PgBouncer
    minConns: 0              # PG_MIN_CONNS (PgBouncer mode)
    slowQueryThreshold: "200ms"  # PG_SLOW_QUERY_THRESHOLD → platform_db_slow_queries_total
    lockTimeout: "2s"        # PG_LOCK_TIMEOUT — a row-lock wait surfaces as an error, not a hang
    statementTimeout: "5s"   # PG_STATEMENT_TIMEOUT for server + consumer
    jobStatementTimeout: "60s"  # PG_STATEMENT_TIMEOUT for the rotator/scheduler CronJobs' cross-tenant scans

# openbao: Kubernetes auth method (§6.3, §10.5, TS-CONFIG-3) — no static
# token, no AWS Secrets Manager permission.
openbao:
  addr: "https://openbao.iam.svc.cluster.local:8200"
  authRole: iam-token-service
  kvMount: iam
  # tokenAudience: audience of the projected ServiceAccount token used for
  # OpenBao's kubernetes auth (OPENBAO_K8S_TOKEN_PATH). Must equal the
  # OpenBao role's `audience` (deploy/openbao/role.tf.example). Empty = log
  # in with the default API-audience token (not recommended).
  tokenAudience: openbao
  # caCertSecret: Secret (key ca.crt) holding the CA that signed OpenBao's
  # TLS certificate, when it is not in the image's system roots (BAO_CACERT).
  caCertSecret: ""

# realmProvisioner: the sibling Realm Provisioner's internal API — the
# RP-17 key-cache refresh cmd/scheduler calls after a cadence rotation
# (TS-D14) and cmd/rotator calls after overlap-expiry revokes (TS-D15).
# The server and consumer make no outbound call here.
realmProvisioner:
  baseUrl: "http://iam-realm-provisioner.iam.svc.cluster.local:8080"

# rotation: overlap-window and cadence tuning (§6.2, §8.3).
# ROTATION_DEFAULT_OVERLAP_SECONDS (server's TS-1 default, scheduler's
# automatic rotations) must be within [0, 900] or startup fails (TS-CONFIG-4).
rotation:
  defaultOverlapSeconds: 300
  defaultCadenceDays: 90
  # ROTATION_REPLAY_WINDOW (server): how long after its first use a TS-1
  # rotation_id may still be replayed for the idempotent outcome; older
  # replays get 409 credential_replay_expired. Go duration; "0" = no limit.
  replayWindow: "15m"

# jwks: rate limit on the unauthenticated-by-header JWKS route (EXT-6,
# TS-D15) — it reads a private key out of OpenBao per live credential on
# every hit and has no caller-identity gate to lean on otherwise. A
# process-wide (not per-tenant) token bucket; well above realistic
# Keycloak fetch volume, low enough to bound OpenBao read amplification.
jwks:
  rateLimitRPS: 20
  rateLimitBurst: 40
  # Per-tenant bucket (keyed by the path tenant id) on top of the global
  # one: one caller flooding one tenant's URL cannot starve other tenants'
  # (above all Keycloak's post-RP-17) fetches.
  perTenantRPS: 5
  perTenantBurst: 10
  # Shared bucket for tenant ids with no live credential (unknown/offboarded):
  # a flood of random tenant ids cannot fill the per-tenant limiter or spend
  # the global budget Keycloak's real fetches need.
  # JWKS_RATE_LIMIT_UNKNOWN_TENANT_RPS / _BURST.
  unknownTenantRPS: 2
  unknownTenantBurst: 5
  # JWKS_KNOWN_TENANTS_REFRESH: how often the server reloads, from Postgres,
  # the set of tenants with a live credential — what decides whether a
  # request is charged to its per-tenant bucket or to the shared unknown
  # bucket above. A tenant issued its first credential on another replica is
  # treated as unknown for up to this long. Go duration, must be > 0.
  knownTenantsRefresh: "15s"

# events: SNS/Glue (§7.3.1, §25 frozen names). topicArn is REQUIRED outside
# local/dev/test (the render fails without it). Empty is only for local/dev/
# test without real AWS, where cmd/server's buildGlueCodec/buildSNSPublisher
# fall back to NoopCodec/a no-op publisher.
events:
  glueRegistryName: iam-serviceaccount-events
  topicArn: ""
  awsRegion: ap-south-1

# outbox: platform-events runner tunables (config.LoadOutbox / OUTBOX_*).
# Deployed defaults match iam-user-profile / LLD §7.4 (500 ms poll).
outbox:
  pollInterval: "500ms"
  batchSize: 50
  maxAttempts: 5
  drainTimeout: "30s"
  publishConcurrency: 4
  publishTimeout: "10s"
  startupJitter: "2s"
  claimLeaseDuration: "10m"

# sqs: the offboarding consumer's one inbound subscription (§7.1, §12).
sqs:
  queueUrl: ""          # SQS_QUEUE_URL — tenant-lifecycle-tokensvc-q; REQUIRED outside local/dev/test (render fails)
  concurrency: 2        # SQS_CONCURRENCY
  maxMessages: 10
  waitSeconds: 20
  visibilityTimeoutSeconds: 60
  # SQS_QUEUE_DEPTH_INTERVAL: platform-events samples the queue's and its
  # DLQ's depth into platform_queue_depth / platform_dlq_depth ("0s" disables).
  queueDepthInterval: "60s"
  # SQS_HANDLER_TIMEOUT stays below the visibility timeout so a hung cascade
  # fails and is redelivered; SQS_DRAIN_TIMEOUT fits inside
  # terminationGracePeriodSeconds.
  handlerTimeout: "45s"
  drainTimeout: "15s"

processedEvents:
  ttlDays: 8

# rlsViolationLog: retention of the sampled RLS violation audit trail
# (migration 000003), pruned by the rotator CronJob.
rlsViolationLog:
  ttlDays: 30

docs:
  enabled: false
  # authEnabled: inject DOCS_AUTH_TOKEN from the Secret (key DOCS_AUTH_TOKEN)
  # to bearer-lock the Swagger/AsyncAPI docs. The token itself lives only in
  # the Secret — never in values. Outside local/dev/test, enabled: true
  # requires authEnabled: true (the render fails, and so would startup).
  authEnabled: false

# otel: read by platform-gincommon. The service name comes from APP_NAME in
# code (no OTEL_SERVICE_NAME). An empty exporterEndpoint renders "none",
# which keeps in-process trace IDs but disables export (gincommon v1.6.0).
otel:
  exporterEndpoint: "otel-collector.observability.svc.cluster.local:4317"
  insecure: false
  samplerRatio: "0.1"               # head sampling ratio in [0,1]
  propagatorBaggage: false          # W3C baggage propagation
  ignoreRemoteParentSampled: false  # true only for edge services taking untrusted traceparent

# APP_ENV — also the `environment` label on every metric. Must be one of
# local | dev | test | staging | prod (Enterprise Platform Observability
# Standard vocabulary, no aliases): platform-gincommon panics at startup on
# anything else, e.g. "production". The docs surfaces treat "prod" as
# production (docs.enabled gates them there).
appEnv: prod
# OBSERVABILITY_DOMAIN — the `domain` label on every metric. Required by
# platform-gincommon; this service's business domain is "iam".
observabilityDomain: iam
logLevel: info      # LOG_LEVEL: debug | info | warn | error
logSampling: false  # LOG_SAMPLING: zap sampling of repetitive entries

# Graceful-shutdown budgets are per workload: server/consumer
# terminationGracePeriodSeconds above.

# ServiceMonitor — requires kube-prometheus-stack (monitoring.coreos.com/v1
# CRD). PrometheusRule (alerting rules, templates/prometheusrule.yaml) is
# also gated on this flag — no scrape means no metrics, which means every
# alert stays permanently inactive.
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  # Labels the Prometheus Operator selects ServiceMonitor / PodMonitor /
  # PrometheusRule objects by — kube-prometheus-stack's default selector is
  # `release: <its release name>`. Without a match nothing is scraped and no
  # rule is loaded.
  additionalLabels:
    release: kube-prometheus-stack
  # podMonitorInterval: the CronJob pods serve /metrics only for their
  # ~15s grace window (ROTATOR/SCHEDULER_METRICS_SCRAPE_GRACE), so they are
  # scraped more often than the long-running pods.
  podMonitorInterval: "5s"
  relabelings: []
  namespaceSelector: {}

existingSecret: ""

# rotationEpoch — used only when existingSecret (or
# database.existingSecretName) is set. Bump this value to trigger a
# rolling restart after an external secret is rotated:
#   helm upgrade ... --set rotationEpoch=$(date +%s)
rotationEpoch: "0"

# secretValues: local/dev convenience only (templates/secret.yaml). The chart
# renders <fullname>-secrets from these and restarts every workload when they
# change (checksum/secret pod annotation). With migrations.enabled that Secret
# is a pre-install/pre-upgrade HOOK (the migrate Job needs it before any
# ordinary resource exists), and hook resources live outside the release's
# manifest:
#   - `helm rollback` does NOT revert it: the Secret keeps the newer values
#     while the rolled-back pods (whose checksum is the old one) restart
#     against them. Re-run `helm upgrade` with the values you want instead.
#   - switching to existingSecret / database.existingSecretName (or turning
#     migrations off) leaves the old hook Secret behind — nothing deletes it
#     (it also carries helm.sh/resource-policy: keep). Delete it by hand:
#       kubectl delete secret <fullname>-secrets
#     It carries meta.helm.sh/release-name/-namespace, so a later non-hook
#     render (migrations.enabled: false) adopts it instead of failing on
#     "already exists".
secretValues: {}
