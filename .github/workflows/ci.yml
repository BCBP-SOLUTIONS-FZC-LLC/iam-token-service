# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/iam-token-service
#
# Parallel flow:
#
#   validate-test ──────┐
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┘
#
# This repo ships FOUR binaries from ONE image (see Dockerfile's header
# comment): /iam-token-service-server (HTTP API TS-1..TS-6 + the
# outbox.Runner SNS-publish loop) is the image's default ENTRYPOINT;
# /iam-token-service-consumer (the offboarding-cascade consumer) and
# /iam-token-service-rotator (the overlap-expiry sweep / orphan-material
# reconciler / prune CronJob entrypoint) and /iam-token-service-scheduler
# (the cadence-rotation CronJob entrypoint) are invoked from the same image
# with an overridden entrypoint. build-image is therefore a single job, not
# a matrix — it builds one image; smoke runs the smoke-tests script four
# times against it (once per binary/entrypoint). push re-runs all four
# against the digest it actually pushed (OCI labels make that digest differ
# from build-image's) before signing it.
#
# build-image lints the Dockerfile (Hadolint + .dockerignore check) as its
# first steps, before the expensive build — a lint failure never starts the
# build, and there's no separate lint-dockerfile job to pay a job-minute for.
# validate-test runs the race+coverage gate and gates trivy/smoke (correctness).
# validate-quality gates push only (style + lint).
# pr-summary posts a status comment on pull_request events (skipped if upstream jobs fail).
#
# paths-ignore skips this entire (expensive) pipeline for commits that only
# touch Markdown docs — those can't affect test/build outcomes. A commit
# that touches both docs and code still runs normally (paths-ignore only
# skips when EVERY changed file matches).
name: CI

"on":
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/iam-token-service
  BUILDKIT_PROGRESS: plain

jobs:
  # ── runs in parallel with validate-quality + build-image ─────────────────
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  # ── runs in parallel with validate-test + build-image ────────────────────
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  # ── runs in parallel with validate-test + validate-quality ───────────────
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    # trivy, smoke and push rebuild from this job's cache; they must pass the
    # SAME build args, or a differing SOURCE_DATE_EPOCH yields a different
    # image (different layer timestamps) from the one the gates tested.
    outputs:
      source_date_epoch: ${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # SOURCE_DATE_EPOCH + cache targets (grouped in docker-build-prep.sh).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      # Log in so registry cache reads (and writes on non-fork runs) are authenticated.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build and write all layers to GHA + registry cache (no local load needed here).
      - name: Build image → cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          # This cache job only feeds downstream trivy/smoke, which load amd64 images.
          # Keep it single-arch to avoid long QEMU emulation on push runs (main branch timeouts).
          # Multi-arch publish still happens in the final "push" job below.
          platforms: linux/amd64
          push: false
          load: false
          # Pull fresh base image on push/manual runs; skip on PRs for speed.
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

  # ── gates on build-image, runs in parallel with smoke ─────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-image.outputs.source_date_epoch }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: iam-token-service-ci-test
          cache-from: type=gha
          # Same build args as build-image, so this is the image it built.
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ needs.build-image.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── gates on validate-test + build-image, runs in parallel with trivy ─────
  # Smoke-tests ALL FOUR binaries this one image carries — the server
  # entrypoint (default), and the consumer, rotator and scheduler
  # entrypoints (overridden).
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 10
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-image.outputs.source_date_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: iam-token-service-ci-test
          cache-from: type=gha
          # Same build args as build-image, so this is the image it built.
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ needs.build-image.outputs.source_date_epoch }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Smoke tests (server)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: server
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (consumer)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: consumer
          ENTRYPOINT: /iam-token-service-consumer
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (rotator)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: rotator
          ENTRYPOINT: /iam-token-service-rotator
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (scheduler)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: scheduler
          ENTRYPOINT: /iam-token-service-scheduler
        run: bash .github/scripts/smoke-tests.sh

  # ── posts or updates a single comment on every PR push ───────────────────
  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke]
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post or update summary comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  # ── push to GHCR on merge to main ────────────────────────────────────────
  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, build-image, trivy, smoke, validate-quality]
    if: github.event_name == 'push'
    # amd64-only publish with provenance/SBOM attestations can exceed 10 minutes.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The value build-image used, so this rebuild is the image trivy/smoke
      # tested (exported to the env too, as buildx reads it from there).
      - name: Set SOURCE_DATE_EPOCH
        id: sde
        env:
          SDE: ${{ needs.build-image.outputs.source_date_epoch }}
        run: |
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Pushed ONLY under a candidate tag. The real tags (main, sha-<short>)
      # are applied by "Publish tags" at the end of this job, after the
      # digest is scanned and signed — mirrors release.yml, so nothing
      # pulling :main can get an image that failed the scan.
      - name: Build and push (candidate)
        id: pushed
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          # amd64-only by design — release.yml's docker job is also amd64-only.
          platforms: linux/amd64
          # No pull: rebuild from the same GHA cache build-image wrote, so the
          # pushed image is the one trivy/smoke tested — a fresh base-image
          # pull here would publish layers no gate ever saw. The pushed
          # digest is re-scanned below before it is signed anyway.
          pull: false
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Gate the signature on a scan AND a smoke run of the exact pushed
      # digest: admission policies trust signed images, so nothing unscanned
      # or unsmoked gets signed.
      - name: Scan pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Smoke the exact pushed digest before it is signed or tagged. This
      # build adds metadata-action OCI labels that the build-image/trivy/smoke
      # loads do not, so its digest differs from the image the smoke job ran;
      # the smoke job proved the code, this proves the artifact. Mirrors
      # release.yml's docker job.
      - name: Pull pushed digest for smoke tests
        run: docker pull "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Smoke tests (server, pushed digest)
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          BINARY: server
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (consumer, pushed digest)
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          BINARY: consumer
          ENTRYPOINT: /iam-token-service-consumer
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (rotator, pushed digest)
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          BINARY: rotator
          ENTRYPOINT: /iam-token-service-rotator
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (scheduler, pushed digest)
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
          BINARY: scheduler
          ENTRYPOINT: /iam-token-service-scheduler
        run: bash .github/scripts/smoke-tests.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      # Verifiable with: cosign verify --certificate-identity-regexp ACTOR \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   ghcr.io/bcbp-solutions-fzc-llc/iam-token-service@DIGEST
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      # Scanned and signed: point the real tags at that digest. imagetools
      # copies the manifest by digest, attestations included.
      - name: Publish tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
