# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/iam-token-service
#
# Parallel flow:
#
#   validate-test ──────┐
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┘
#
# This repo ships THREE binaries from ONE image (see Dockerfile's header
# comment): /iam-token-service-server (HTTP API TS-1..TS-4 + the
# outbox.Runner SNS-publish loop) is the image's default ENTRYPOINT;
# /iam-token-service-consumer (the offboarding-cascade consumer) and
# /iam-token-service-rotator (the overlap-expiry sweep / orphan-material
# reconciler / prune CronJob entrypoint) are invoked from the same image
# with an overridden entrypoint. build-image is therefore a single job, not
# a matrix — it builds one image; smoke runs the smoke-tests script three
# times against it (once per binary/entrypoint).
#
# build-image lints the Dockerfile (Hadolint + .dockerignore check) as its
# first steps, before the expensive build — a lint failure never starts the
# build, and there's no separate lint-dockerfile job to pay a job-minute for.
# validate-test runs the race+coverage gate and gates trivy/smoke (correctness).
# validate-quality gates push only (style + lint).
# pr-summary posts a status comment on pull_request events (skipped if upstream jobs fail).
#
# paths-ignore skips this entire (expensive) pipeline for commits that only
# touch Markdown docs — those can't affect test/build outcomes. A commit
# that touches both docs and code still runs normally (paths-ignore only
# skips when EVERY changed file matches).
name: CI

"on":
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/iam-token-service
  BUILDKIT_PROGRESS: plain

jobs:
  # ── runs in parallel with validate-quality + build-image ─────────────────
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  # ── runs in parallel with validate-test + build-image ────────────────────
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  # ── runs in parallel with validate-test + validate-quality ───────────────
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # SOURCE_DATE_EPOCH + cache targets (grouped in docker-build-prep.sh).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      # Log in so registry cache reads (and writes on non-fork runs) are authenticated.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and write all layers to GHA + registry cache (no local load needed here).
      - name: Build image → cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # This cache job only feeds downstream trivy/smoke, which load amd64 images.
          # Keep it single-arch to avoid long QEMU emulation on push runs (main branch timeouts).
          # Multi-arch publish still happens in the final "push" job below.
          platforms: linux/amd64
          push: false
          load: false
          # Pull fresh base image on push/manual runs; skip on PRs for speed.
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

  # ── gates on build-image, runs in parallel with smoke ─────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: iam-token-service-ci-test
          cache-from: type=gha
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iam-token-service-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── gates on validate-test + build-image, runs in parallel with trivy ─────
  # Smoke-tests ALL THREE binaries this one image carries — the server
  # entrypoint (default), the consumer entrypoint, and the rotator
  # entrypoint (both overridden).
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: iam-token-service-ci-test
          cache-from: type=gha
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Smoke tests (server)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: server
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (consumer)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: consumer
          ENTRYPOINT: /iam-token-service-consumer
        run: bash .github/scripts/smoke-tests.sh

      - name: Smoke tests (rotator)
        env:
          IMAGE_TAG: iam-token-service-ci-test
          BINARY: rotator
          ENTRYPOINT: /iam-token-service-rotator
        run: bash .github/scripts/smoke-tests.sh

  # ── posts or updates a single comment on every PR push ───────────────────
  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke]
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post or update summary comment
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  # ── push to GHCR on merge to main ────────────────────────────────────────
  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, trivy, smoke, validate-quality]
    if: github.event_name == 'push'
    # amd64-only publish with provenance/SBOM attestations can exceed 10 minutes.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # amd64-only by design — release.yml's docker job is also amd64-only.
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      # Verifiable with: cosign verify --certificate-identity-regexp ACTOR \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   ghcr.io/bcbp-solutions-fzc-llc/iam-token-service@DIGEST
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
