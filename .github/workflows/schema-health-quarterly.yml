name: Schema Health Quarterly Review
# Scheduled review prompt for schema registry health — version accumulation,
# overdue deprecations, and stale lifecycle annotations.
#
# This workflow never mutates anything. Its only output is a GitHub Step
# Summary that an operator reads and acts on manually. Subsequent cleanup
# actions go through the appropriate dedicated workflows:
#
#   schema-prune.yml      — retire orphaned schemas (monthly dry-run + manual execute)
#   schema-registry.yml   — re-register / validate schemas
#
# Lifecycle lint runs schema-gov validate (Pass 4), installed from source
# (pip install git+.../platform-schemagov) the same way schema-registry.yml
# does — the package's GHCR "Manage Actions access" allow-list doesn't
# include this repo, so GO_PRIVATE_TOKEN (already used for private Go module
# access) authorizes the git clone instead.
#
# Unlike iam-org-membership (two co-owned registries), this service's
# iam-serviceaccount-events registry is single-producer — no matrix needed.
#
# Thresholds (repository variables — override via vars.*):
#   SCHEMA_VERSIONS_ALERT_THRESHOLD  — Glue version count that flags a schema for
#                                      compaction review (default: 10)
#
# Required environment variables (staging environment):
#   AWS_REGION, AWS_ROLE_ARN (OIDC role to assume — §13.5, no long-lived keys)
#
# Required environment variables:
#   GLUE_REGISTRY_SERVICEACCOUNT_NAME

"on":
  schedule:
    - cron: '0 9 1 1,4,7,10 *'   # quarterly: 09:00 UTC on 1 Jan / 1 Apr / 1 Jul / 1 Oct
  workflow_dispatch:
    inputs:
      version_threshold:
        description: 'Glue version count to flag as compaction candidate (default: 10)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  health-review:
    name: Quarterly schema health review
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write   # OIDC — AWS role assumption, no long-lived keys (§13.5)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python (schema-gov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install schema-gov (platform-schemagov v0.4.0)
        run: |
          pip install --no-cache-dir "git+https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/BCBP-SOLUTIONS-FZC-LLC/platform-schemagov.git@v0.4.0"

      # ── 1. Lifecycle lint ────────────────────────────────────────────────────
      # Runs schema-gov validate (all 8 passes, including Pass 4 lifecycle) —
      # the same check enforced in CI on every push. Surfaces: overdue
      # retire-after dates, missing annotations, deprecated schemas without a
      # replacement pointer, enum drift, Draft-07 violations, and AsyncAPI
      # coverage gaps.
      # Runs unconditionally on a quarterly schedule so the team sees the full
      # picture even when no schema changes were pushed this quarter.
      - name: Lifecycle lint
        id: lifecycle
        run: |
          LIFECYCLE_EXIT=0
          schema-gov validate \
            --asyncapi   api/asyncapi.yaml \
            --schema-dir internal/adapter/outbound/eventbus/schemas \
            --warn-days  30 \
            --max-window 180 \
            2>&1 | tee "${{ runner.temp }}/lifecycle-output.txt" || LIFECYCLE_EXIT=$?
          echo "lifecycle_exit=${LIFECYCLE_EXIT}" >> "${GITHUB_OUTPUT}"
          if [ "${LIFECYCLE_EXIT}" -ne 0 ]; then
            printf '::warning title=Lifecycle Violations::schema-gov validate reported %d violation(s). Review the Step Summary.\n' \
              "$(grep -c '✘' "${{ runner.temp }}/lifecycle-output.txt" 2>/dev/null || echo '?')"
          fi

      # ── 2. Version accumulation scan ────────────────────────────────────────
      # Lists every schema in the Glue registry and flags those whose version
      # count exceeds the threshold. High version counts signal schemas that
      # have been evolving in-place — compaction-protocol candidates.
      - name: Version accumulation scan
        id: version_scan
        env:
          REGISTRY_NAME: ${{ vars.GLUE_REGISTRY_SERVICEACCOUNT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          VERSION_THRESHOLD_INPUT: ${{ inputs.version_threshold }}
        run: |
          THRESHOLD="${VERSION_THRESHOLD_INPUT:-${SCHEMA_VERSIONS_ALERT_THRESHOLD:-10}}"
          echo "  ·  Glue registry: ${REGISTRY_NAME}  threshold: ${THRESHOLD}"

          # List all schemas in the registry — paginate via next-token if needed.
          SCHEMAS_JSON=$(aws glue list-schemas \
            --registry-id "RegistryName=${REGISTRY_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Schemas[].{name:SchemaName,arn:SchemaArn}' \
            --output json 2>/dev/null || echo '[]')

          CANDIDATES=""
          CANDIDATE_COUNT=0

          while IFS='|' read -r _name _arn; do
            [ -z "${_name}" ] && continue
            # GetSchema returns LatestSchemaVersion — the total version count.
            LATEST=$(aws glue get-schema \
              --schema-id "SchemaArn=${_arn}" \
              --region "${AWS_REGION}" \
              --query 'LatestSchemaVersion' \
              --output text 2>/dev/null || echo 0)
            if [ "${LATEST:-0}" -gt "${THRESHOLD}" ] 2>/dev/null; then
              CANDIDATES="${CANDIDATES}  ⚠  ${_name}  v${LATEST}  (threshold: ${THRESHOLD})\n"
              CANDIDATE_COUNT=$((CANDIDATE_COUNT + 1))
              printf '::warning title=Version Accumulation::%s has reached Glue version %d (threshold: %d). Consider compaction — see x-version-governance in api/asyncapi.yaml.\n' \
                "${_name}" "${LATEST}" "${THRESHOLD}"
            else
              printf '  ✔  %-36s  v%s\n' "${_name}" "${LATEST}"
            fi
          done < <(echo "${SCHEMAS_JSON}" | jq -r '.[] | "\(.name)|\(.arn)"')

          echo "candidate_count=${CANDIDATE_COUNT}" >> "${GITHUB_OUTPUT}"
          printf '%s' "${CANDIDATES}" > "${{ runner.temp }}/version-candidates.txt"

      # ── 3. GitHub Step Summary ───────────────────────────────────────────────
      - name: Write Step Summary
        env:
          REGISTRY_NAME: ${{ vars.GLUE_REGISTRY_SERVICEACCOUNT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          LIFECYCLE_EXIT: ${{ steps.lifecycle.outputs.lifecycle_exit }}
          CANDIDATE_COUNT: ${{ steps.version_scan.outputs.candidate_count }}
          VERSION_THRESHOLD_INPUT: ${{ inputs.version_threshold }}
        run: |
          THRESHOLD="${VERSION_THRESHOLD_INPUT:-${SCHEMA_VERSIONS_ALERT_THRESHOLD:-10}}"
          RUN_DATE=$(date -u +%Y-%m-%d)

          {
            printf '# Schema Registry Quarterly Health Review — %s\n\n' "${RUN_DATE}"
            printf '> Registry: `%s` · Region: `%s`\n\n' "${REGISTRY_NAME}" "${AWS_REGION}"

            printf '## 1. Lifecycle annotations\n\n'
            if [ "${LIFECYCLE_EXIT}" -eq 0 ]; then
              printf '✅ All lifecycle annotations are valid — no violations.\n\n'
            else
              printf '❌ **Violations found** — see full output below. Fix before next release.\n\n'
            fi
            printf '<details><summary>Full lifecycle lint output</summary>\n\n```\n'
            cat "${{ runner.temp }}/lifecycle-output.txt" 2>/dev/null || echo "(no output)"
            printf '\n```\n</details>\n\n'

            printf '## 2. Version accumulation\n\n'
            printf '**Threshold:** Glue version > `%s` → compaction candidate\n\n' "${THRESHOLD}"
            if [ "${CANDIDATE_COUNT:-0}" -eq 0 ]; then
              printf '✅ All schemas are within the version threshold.\n\n'
            else
              printf '⚠ **%d schema(s) exceed the version threshold:**\n\n```\n' "${CANDIDATE_COUNT}"
              cat "${{ runner.temp }}/version-candidates.txt" 2>/dev/null
              printf '```\n\n'
              printf 'Follow the compaction-protocol in `api/asyncapi.yaml` → `x-version-governance`.\n'
              printf 'The 6-step protocol creates a clean `.v2` event type and retires the old one.\n\n'
            fi

            printf '## 3. Recommended follow-up actions\n\n'
            printf '| Priority | Action | Workflow |\n'
            printf '|----------|--------|----------|\n'
            if [ "${LIFECYCLE_EXIT}" -ne 0 ]; then
              printf '| 🔴 High | Fix lifecycle violations (overdue retirements, stale overrides) | Push a fix to `main` — CI Pass 4 enforces |\n'
            fi
            if [ "${CANDIDATE_COUNT:-0}" -gt 0 ]; then
              printf '| 🟡 Medium | Compaction review for version-accumulated schemas | Follow `x-version-governance.compaction-protocol` |\n'
            fi
            printf '| 🟢 Low | Orphan cleanup (schemas in Glue with no repo file) | Trigger `schema-prune.yml` (dry-run first) |\n'
            printf '| 🟢 Low | Review COLD events — consider deprecating low-activity schemas | `schema-gov usage-check` output in `schema-registry.yml` |\n'

            printf '\n---\n'
            printf '_Quarterly watchdog · Run [%s](%s/%s/actions/runs/%s)_\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
