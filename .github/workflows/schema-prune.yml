# Periodically prune orphaned (retired) schemas from the Glue Schema Registry.
#
# A schema is a prune candidate when it exists in Glue but has no corresponding
# file in internal/adapter/outbound/eventbus/schemas/ — i.e. it has been retired and its JSON file
# removed from the repo via the normal lifecycle process. Unlike
# iam-org-membership (two co-owned registries), this service's
# iam-serviceaccount-events registry is single-producer — no matrix needed.
#
# Two modes:
#   Dry-run (default): lists candidates and version counts. No AWS mutations.
#   Execute          : archives all version definitions to docs/schema-archive/,
#                      deletes the schema from Glue, commits the archive files.
#
# Archive layout committed to the repo:
#   docs/schema-archive/
#     {schema-name}/
#       _meta.json  — provenance: schema, registry, environment, pruned_at
#       v1.json     — raw JSON Schema definition as stored in Glue
#       v2.json
#       ...
#
# Triggers:
#   schedule (monthly, 1st of month)  → staging dry-run report only
#   workflow_dispatch                  → staging or production, dry-run or execute
#
# Design constraints:
#   • Production pruning is NEVER scheduled — always requires a deliberate
#     workflow_dispatch with environment=production. An operator must explicitly
#     un-check dry_run to perform deletions.
#   • The schedule produces a monthly candidate report. An operator reviews the
#     output in the Actions log, then re-triggers manually with dry_run=false
#     when ready to execute.
#   • glue:DeleteSchema is permanent — once deleted, old consumers referencing
#     a schema version UUID will receive an error from Glue. Only prune schemas
#     that have been fully retired and all consumers confirmed migrated.
#
# AWS access is via OIDC (§13.5 — "no long-lived keys"), matching
# schema-registry.yml — not the static access-key secrets iam-org-membership's
# version of this workflow uses.
#
# schema-gov is installed from source (pip install git+.../platform-schemagov)
# rather than pulled as a prebuilt GHCR image — see schema-registry.yml for why.
#
# Required GitHub environment variables (staging / production):
#   AWS_REGION, AWS_ROLE_ARN (OIDC role to assume), GLUE_REGISTRY_SERVICEACCOUNT_NAME

name: Schema Registry Prune

"on":
  schedule:
    - cron: '0 2 1 * *'    # monthly on the 1st at 02:00 UTC — staging dry-run report
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target registry environment'
        required: true
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: 'Dry run — list candidates only; no deletions or archive commits'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Staging ─────────────────────────────────────────────────────────────────
  # Triggered by the monthly schedule (always dry-run) or workflow_dispatch
  # targeting staging (dry-run or execute, per the input).
  prune-staging:
    name: Prune schemas → staging
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    permissions:
      contents: write    # required by "Commit archived schemas" step (execute mode only)
      id-token: write   # OIDC — AWS role assumption, no long-lived keys (§13.5)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python (schema-gov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install schema-gov (platform-schemagov v0.4.0)
        run: |
          pip install --no-cache-dir "git+https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/BCBP-SOLUTIONS-FZC-LLC/platform-schemagov.git@v0.4.0"

      # prune treats a Glue schema as orphaned when no FILE STEM in --schema-dir
      # matches its name. The committed schema files are snake_case while every
      # registered name is PascalCase, so pointing prune at them (or at its
      # internal/eventschema default) lists EVERY live schema as an orphan —
      # and --execute would archive + delete them. Prune compares against the
      # PascalCase, produced-only staged copy instead.
      - name: Stage produced schemas under their Glue names
        run: |
          rm -rf .tmp/glue-schemas
          bash .github/scripts/stage-produced-event-schemas.sh .tmp/glue-schemas

      # Schedule always runs dry-run (generates a monthly candidate report).
      # workflow_dispatch respects the dry_run input; un-check to execute.
      - name: Prune orphaned schemas
        env:
          # Treat any non-false value (including schedule's empty string) as dry-run.
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          EXECUTE_FLAG=""
          if [ "${IS_SCHEDULE}" != "true" ] && [ "${DRY_RUN_INPUT}" = "false" ]; then
            EXECUTE_FLAG="--execute"
          fi
          schema-gov prune \
            --registry "${{ vars.GLUE_REGISTRY_SERVICEACCOUNT_NAME }}" \
            --schema-dir .tmp/glue-schemas \
            --env      staging \
            --output   "${{ runner.temp }}/schema-prune-metrics.json" \
            ${EXECUTE_FLAG}

      # Commit the archive files produced by execute mode.
      # Skip in dry-run and on schedule (both are read-only).
      - name: Commit archived schemas
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schema-archive/
          if git diff --cached --quiet; then
            echo "  ·  nothing to commit (no schemas archived — all candidates may have failed)"
            exit 0
          fi
          PRUNED=$(jq -r '.pruned // 0' "${RUNNER_TEMP}/schema-prune-metrics.json" 2>/dev/null || echo 0)
          ARCHIVED=$(jq -r '.archived // 0' "${RUNNER_TEMP}/schema-prune-metrics.json" 2>/dev/null || echo 0)
          git commit -m "chore(schema-archive): archive ${PRUNED} retired schema(s), ${ARCHIVED} version(s) (staging)"
          _MAX=3 _i=0
          while [ "$_i" -lt "$_MAX" ]; do
            _i=$((_i + 1))
            if git push origin HEAD; then
              echo "  ✔  archive committed (attempt ${_i})"
              break
            fi
            if [ "$_i" -ge "$_MAX" ]; then
              echo "  ⚠  push failed after ${_MAX} attempts" >&2
              break
            fi
            echo "  ⟳  push rejected (attempt ${_i}) — rebasing..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; break; }
          done

  # ── Production ──────────────────────────────────────────────────────────────
  # NEVER triggered by schedule — only by explicit workflow_dispatch with
  # environment=production. Defaults to dry_run=true so an operator must
  # deliberately un-check the dry-run box to perform actual Glue deletions.
  prune-production:
    name: Prune schemas → production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python (schema-gov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install schema-gov (platform-schemagov v0.4.0)
        run: |
          pip install --no-cache-dir "git+https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/BCBP-SOLUTIONS-FZC-LLC/platform-schemagov.git@v0.4.0"

      # prune treats a Glue schema as orphaned when no FILE STEM in --schema-dir
      # matches its name. The committed schema files are snake_case while every
      # registered name is PascalCase, so pointing prune at them (or at its
      # internal/eventschema default) lists EVERY live schema as an orphan —
      # and --execute would archive + delete them. Prune compares against the
      # PascalCase, produced-only staged copy instead.
      - name: Stage produced schemas under their Glue names
        run: |
          rm -rf .tmp/glue-schemas
          bash .github/scripts/stage-produced-event-schemas.sh .tmp/glue-schemas

      - name: Prune orphaned schemas
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          EXECUTE_FLAG=""
          [ "${DRY_RUN_INPUT}" = "false" ] && EXECUTE_FLAG="--execute"
          schema-gov prune \
            --registry "${{ vars.GLUE_REGISTRY_SERVICEACCOUNT_NAME }}" \
            --schema-dir .tmp/glue-schemas \
            --env      production \
            --output   "${{ runner.temp }}/schema-prune-metrics.json" \
            ${EXECUTE_FLAG}

      # Production checks out the release tag (detached HEAD, matching
      # schema-registry.yml), so push targets refs/heads/main explicitly.
      - name: Commit archived schemas
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schema-archive/
          if git diff --cached --quiet; then
            echo "  ·  nothing to commit (no schemas archived)"
            exit 0
          fi
          PRUNED=$(jq -r '.pruned // 0' "${RUNNER_TEMP}/schema-prune-metrics.json" 2>/dev/null || echo 0)
          ARCHIVED=$(jq -r '.archived // 0' "${RUNNER_TEMP}/schema-prune-metrics.json" 2>/dev/null || echo 0)
          git commit -m "chore(schema-archive): archive ${PRUNED} retired schema(s), ${ARCHIVED} version(s) (production)"
          _MAX=3 _i=0
          while [ "$_i" -lt "$_MAX" ]; do
            _i=$((_i + 1))
            if git push origin HEAD:refs/heads/main; then
              echo "  ✔  archive committed (attempt ${_i})"
              break
            fi
            if [ "$_i" -ge "$_MAX" ]; then
              echo "  ⚠  push failed after ${_MAX} attempts" >&2
              break
            fi
            echo "  ⟳  push rejected (attempt ${_i}) — rebasing..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; break; }
          done
