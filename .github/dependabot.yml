version: 2
registries:
  github-bcbp:
    type: git
    url: https://github.com/BCBP-SOLUTIONS-FZC-LLC
    username: x-access-token
    password: ${{secrets.GO_PRIVATE_TOKEN}}

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    registries:
      - github-bcbp
    labels:
      - dependencies
      - go

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

# Enabled: third-party GitHub Actions are pinned to commit SHAs (with the
# tag in a trailing comment), and this file is what keeps those pins — and
# Go modules and the base images — current.
#
# The github-bcbp registry entry requires a Dependabot secret named
# GO_PRIVATE_TOKEN in Settings → Secrets and variables → Dependabot (a
# distinct secret store from Actions secrets — the same token used there
# does not automatically apply here). Without it, only the gomod updates for
# private modules fail; github-actions and docker updates still run.
